services:
  - type: web
    name: comhal-study
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "sh scripts/render_start.sh"
    healthCheckPath: /
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DJANGO_PREMIUM_GATING_ENABLED
        value: "0"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "1"
      - key: DJANGO_SESSION_COOKIE_SECURE
        value: "1"
      - key: DJANGO_CSRF_COOKIE_SECURE
        value: "1"
      - key: DJANGO_SECURE_PROXY_SSL_HEADER
        value: "1"
      - key: DJANGO_WHITENOISE_MANIFEST_STRICT
        value: "0"
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: NAVER_OAUTH_CLIENT_ID
        sync: false
      - key: NAVER_OAUTH_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: comhal-study-db
          property: connectionString

databases:
  - name: comhal-study-db
    plan: 0.1c-256mb
    diskSizeGB: 1
    databaseName: comhal_study
    user: comhal_study
