name: Validate question CSVs
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Validate catalog and report missing IDs
        env:
          BEFORE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          DJANGO_DEBUG: '1'
        run: python manage.py validate_mission_csvs --base-ref "$BEFORE_REF"
