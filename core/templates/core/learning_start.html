{% extends 'core/base.html' %}
{% block title %}나의 학습 출발점{% endblock %}
{% block content %}
<main class="page-shell compact-page"><section class="card">
  <h1>{{ subject.name }} 학습 시작</h1>
  <p>가볍게 출발점을 정해요. 진단 없이 바로 시작해도 됩니다.</p>
  <p>3문제 확인은 일부 범위를 살펴보는 과정이며 합격 가능성이나 전체 실력을 판정하지 않습니다. 준비된 범위가 적으면 3문제보다 적을 수 있어요.</p>
  <form method="post" class="learning-start-form">{% csrf_token %}{{ form.as_p }}<button class="main-button" type="submit">선택한 방법으로 시작</button></form>
  <p><a href="{% url 'mission_list' %}">나중에 설정하고 바로 학습하기</a></p>
</section></main>
{% endblock %}
